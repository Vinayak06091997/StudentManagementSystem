<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Studeent MNG</title>
<link rel="stylesheet" 
		href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" 
		integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" 
		crossorigin="anonymous">
</head>
<body>
		<div>
		<nav class="navbar navbar-expand-md bg-dark navbar-dark">
			  <!-- Brand -->
			  <a class="navbar-brand" href="#">Student Managment </a>
			
			  <!-- Toggler/collapsibe Button -->
			  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
			    <span class="navbar-toggler-icon"></span>
			  </button>
			
			  <!-- Navbar links -->
			  <div class="collapse navbar-collapse" id="collapsibleNavbar">
			    <ul class="navbar-nav">
			      <li class="nav-item">
			        <a class="nav-link" th:href="@{/students}">Link</a>
			      </li>
			      <li class="nav-item">
			        <a class="nav-link" th:href="@{/students}">Link</a>
			      </li>
			      <li class="nav-item">
			        <a class="nav-link" th:href="@{/students}">Link</a>
			      </li>
			    </ul>
			  </div>
			</nav>
	</div>
	</br></br>
		<div class="container">
				<div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card" > 
					<h3 class="text-center">Create New Student </h3>
					<div class="card-body">
						<form th:action="@{/students}" th:object="${student}" method="post"	>				
							<div class="form-group">
								<label>Enter the Student First Name</label>	
								<input 
									type="text"
									name="firstName"
									class="form-control"
									th:field="*{firstName}"
									placeholder="First Name">
							</div>
							<div class="form-group">
								<label>Enter the Student Last Name</label>	
								<input 
									type="text"
									class="form-control"
									name="lastName"
									th:field="*{lastName}"
									placeholder="last Name">
							</div>
							<div class="form-group">
								<label>Enter the Student Email Id</label>	
								<input 
									type="text"
									name="email"
									class="form-control"
									th:field="*{email}"
									placeholder=" Email Id">
							</div>
							<div class="box-footer">
								<button type="submit" class="btn btn-primary">Submit</button>
							</div>
						</form> 
					</div>
				</div>
		</div>
</body>
</html>
