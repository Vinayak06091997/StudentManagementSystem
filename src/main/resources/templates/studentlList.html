<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>Studeent MNG</title>
<link rel="stylesheet" 
		href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" 
		integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" 
		crossorigin="anonymous">
</head>
<body>
	<div>
		<nav class="navbar navbar-expand-md bg-dark navbar-dark">
			  <!-- Brand -->
			  <a class="navbar-brand" href="#">Student Managment </a>
			
			  <!-- Toggler/collapsibe Button -->
			  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
			    <span class="navbar-toggler-icon"></span>
			  </button>
			
			  <!-- Navbar links -->
			  <div class="collapse navbar-collapse" id="collapsibleNavbar">
			    <ul class="navbar-nav">
			      <li class="nav-item">
			        <a class="nav-link" th:href="@{/students}">Link</a>
			      </li>
			      <li class="nav-item">
			        <a class="nav-link" th:href="@{/students}">Link</a>
			      </li>
			      <li class="nav-item">
			        <a class="nav-link" th:href="@{/students}">Link</a>
			      </li>
			    </ul>
			  </div>
			</nav>
	</div>
	
		<div class="container">
			<div class="row">
				<h1> List Of Students</h1>
				<div class="row">
					<div class="col-lg-3">
						<a th:href="@{/students/new}" class="btn btn-primary btn-sm mb-3">Add Student</a>
					</div>
				</div>
				<table class="table table-striped table-bordere">
					  <thead class="thead-dark">
					    <tr>
					      <th scope="col">Student First Name</th>
					      <th scope="col">Student Last Name</th>
					      <th scope="col">Student Email</th>
					      <th scope="col">Actions</th>
					    </tr>
					  </thead>
					  <tbody>
					    <tr th:each="student:${student}">
					      <td th:text = "${student.firstName}"></td>
					      <td th:text = "${student.lastName}"></td>
					      <td th:text = "${student.email}"></td>
					      <td>
							  <a th:href="@{/students/edit/{id}(id=${student.id})}" 
							  class="btn btn-primary">Update</a>
							  <a th:href="@{/students/delete/{id}(id=${student.id})}" 
							  class="btn btn-danger">Delete</a>
						  </td>
					    </tr>
					    
					  </tbody>
					</table>
			</div>
		</div>
</body>
</html>
